name: Refresh repository stats

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh stats
        run: node scripts/refresh-stats.mjs
        env:
          CONNECT_READ_TOKEN: ${{ secrets.CONNECT_READ_TOKEN }}

      - name: Commit changed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi
          git commit -m "Refresh repository stats"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
